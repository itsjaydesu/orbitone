name: Claude Code Review

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: number

jobs:
  claude-review:
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    # Opt-in via the `claude-review` label (or manual workflow_dispatch) so routine PR pushes don't burn hosted minutes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft != true &&
      contains(github.event.pull_request.labels.*.name, 'claude-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: the bot must be able to post its output — with read-only tokens the
      # action exits 0 and the check shows green while the review/reply is silently
      # permission-denied and discarded (fleet-wide fix, 2026-07-12).
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr_number }} --comment'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

